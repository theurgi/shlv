[package]
name = "shlv"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A fast, resource-efficient bookmark manager"
repository = "https://github.com/theurgi/shlv"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }
rusqlite = { version = "0.42.0", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.1", default-features = false, features = [
  "std",
  "serde",
  "parse",
  "display",
] }
uuid = { version = "1.29.2", features = ["v7"] }
# HTTPS with rustls and bundled webpki roots; no gzip, no charset (see task 016).
ureq = { version = "3.5.2", default-features = false, features = ["rustls"], optional = true }

[features]
# Network access: `add --fetch` and `shlv fetch`. Off by default; the core stays offline.
fetch = ["dep:ureq"]

[profile.release]
lto = true
codegen-units = 1
strip = true
